; Epic 117: packaged builds ship the Crash Report Client and their .pdb files, so a crash in the
; field leaves a report with a symbolized call stack (Saved/Crashes/<id>/CrashContext.runtime-xml)
; that tools/crash_report.py can route to an issue. Shipping the symbols suits tester builds;
; Specs/Privacy_Telemetry.md says what changes before a public release.
[/Script/UnrealEd.ProjectPackagingSettings]
bIncludeCrashReporter=True
bIncludeDebugFiles=True

; Epic 152: the platform implementation behind UPSPlatformServices. Win64 and every test use the
; null/local one; a platform's own Game.ini (Config/IOS/IOSGame.ini, the Xbox platform's later)
; names its implementation here, so gameplay code never branches on the platform.
[/Script/PlaySports.PSPlatformServices]
BackendClass=/Script/PlaySports.PSPlatformBackendLocal
