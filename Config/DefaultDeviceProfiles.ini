; Epic 129: the rendering half of the platform tiers. The code half (AI decision rate and
; anything else with a per-tier cost) is Data/platform_tiers.json; each tier there names its
; profile here. Specs/Platform_Audit.md explains the budgets.
;
; MobileBaseline settings live on the engine's own IOS profile, so every iOS device inherits
; them; the engine's per-model iPhone profiles build on IOS. PSMobileLow is for devices that
; need less: attach it as BaseProfileName of the matching per-model profile once the targets are
; confirmed on a Mac (Epic 131). Windows keeps the engine defaults (the DesktopHigh tier).
;
; Unverified until an iOS build exists: these settings compile into nothing on Win64 CI, so their
; effect on a phone is a Mac-and-device check (Specs/Platform_Audit.md, "Verification").

[DeviceProfiles]
+DeviceProfileNameAndTypes=PSMobileLow,IOS

[IOS DeviceProfile]
+CVars=sg.ViewDistanceQuality=2
+CVars=sg.ShadowQuality=1
+CVars=sg.PostProcessQuality=1
+CVars=sg.TextureQuality=2
+CVars=sg.EffectsQuality=1
+CVars=sg.FoliageQuality=1
+CVars=t.MaxFPS=60

[PSMobileLow DeviceProfile]
DeviceType=IOS
BaseProfileName=IOS
+CVars=sg.ResolutionQuality=75
+CVars=sg.ViewDistanceQuality=1
+CVars=sg.ShadowQuality=0
+CVars=sg.PostProcessQuality=0
+CVars=sg.TextureQuality=1
+CVars=sg.EffectsQuality=0
+CVars=sg.FoliageQuality=0
+CVars=t.MaxFPS=30

; Epic 150: the XboxSeries tier's rendering half, on the engine's own XSX profile as MobileBaseline
; is on IOS, so every Xbox Series X|S device profile under it inherits it. The tier is budgeted for
; Series S, the floor; Series X may raise its own child profile's settings once there is hardware to
; measure on (Epic 151). Unverified: the XSX profile and its children come from the Xbox platform
; extension, which is gated behind ID@Xbox (Specs/ADR_Xbox_Access.md). On Win64 the engine has no XSX
; profile, so this section changes nothing here.
[XSX DeviceProfile]
+CVars=t.MaxFPS=60
