; Epic 131: iOS target settings, iPhone first (the reference device is the owner's iPhone 17 Pro).
; Unverified until a Mac build: Win64 CI never reads this section. These values take effect, and
; can only be checked, when the project is built for iOS on a Mac (Specs/ADR_iOS_Build.md).
; Frame-rate caps and rendering quality are not set here: they belong to the device profiles
; (Config/DefaultDeviceProfiles.ini, Epic 129).
[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
; Placeholder bundle ID. Apple needs one unique to the owner's team: replace it before the first
; signed build (Specs/iOS_Signing_Runbook.md, step 2).
BundleIdentifier=com.example.playsports
BundleDisplayName=Play Sports
BundleName=PlaySports
; iPhone only for now. iPad brings its own layout and orientation rules: a later decision.
bSupportsIPhone=True
bSupportsIPad=False
; Landscape only, either way up.
bSupportsPortraitOrientation=False
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True
PreferredLandscapeOrientation=LandscapeLeft
; Metal, with the mobile renderer (Specs/Platform_Audit.md): the desktop renderer on Metal stays
; off. Both match the engine defaults; they are set to record the decision.
bSupportsMetal=True
bSupportsMetalMRT=False
; The game uses neither. Keeping them off keeps the app's entitlements to what a free Apple ID can
; sign (Specs/iOS_Signing_Runbook.md, path A).
bEnableGameCenterSupport=False
bEnableRemoteNotificationsSupport=False
; Minimum iOS version: deliberately left at the engine's default. The iPhone 17 Pro runs a newer
; iOS than any 5.8 minimum, and the enum's values (IOS_<n>) change between engine versions, so a
; value written here unverified could name one that 5.8 no longer has. Pick it from the dropdown
; in Project Settings > Platforms > iOS on the first Mac build; the line below is the intended shape.
;MinimumiOSVersion=IOS_17

[CrashReportClient]
; Epic 117: a crash is captured on the machine (Saved/Crashes/<id>: the crash context with the
; game's PS.* keys, a minidump, the log) and never uploaded by the engine: no data router, no
; unattended sends. A person routes reports to GitHub issues with tools/crash_report.py, which
; copies only allowlisted, scrubbed fields. See Specs/Privacy_Telemetry.md.
DataRouterUrl=""
bAgreeToCrashUpload=false
bSendUnattendedBugReports=false
bAllowToBeContacted=false
bSendLogFile=false

