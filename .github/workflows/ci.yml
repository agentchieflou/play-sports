name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Win64 Development Editor)
    runs-on: [self-hosted, windows, unreal]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint conventions
        shell: powershell
        run: |
          python tools/lint_conventions.py
          if ($LASTEXITCODE -ne 0) { throw "Convention linter failed" }

      - name: Validate data contracts
        # Every contract and every cross-file reference (tools/content_contracts.py, Epic 125):
        # a generated-content PR is gated here like any other.
        shell: powershell
        run: |
          python tools/validate_data.py
          if ($LASTEXITCODE -ne 0) { throw "Data validation failed" }

      - name: Content report
        # Rating distributions, name duplication and roster shape (Epic 125). Informational:
        # it warns in the log and does not fail the build.
        shell: powershell
        run: python tools/content.py report

      - name: Tool tests
        shell: powershell
        run: |
          python -m unittest discover -s tools/tests -t . -v
          if ($LASTEXITCODE -ne 0) { throw "Tool unit tests failed" }

      - name: Build PlaySportsEditor
        shell: powershell
        run: |
          if (-not $env:UE_ROOT) { throw "UE_ROOT is not set on this runner." }
          & "$env:UE_ROOT\Engine\Build\BatchFiles\Build.bat" PlaySportsEditor Win64 Development -project="$env:GITHUB_WORKSPACE\play-sports.uproject" -WaitMutex
          if ($LASTEXITCODE -ne 0) { throw "UnrealBuildTool failed with exit code $LASTEXITCODE" }

      - name: Run automation tests (headless)
        shell: powershell
        run: |
          if (-not $env:UE_ROOT) { throw "UE_ROOT is not set on this runner." }
          $ReportDir = "$env:GITHUB_WORKSPACE\Saved\AutomationReport"
          & "$env:UE_ROOT\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" "$env:GITHUB_WORKSPACE\play-sports.uproject" -ExecCmds="Automation RunTests PlaySports" -TestExit="Automation Test Queue Empty" -ReportOutputPath="$ReportDir" -unattended -nullrhi -nosplash -nop4 -log
          if ($LASTEXITCODE -ne 0) { throw "Automation run failed with exit code $LASTEXITCODE" }
          # The editor can exit 0 despite failing tests - the report is the truth.
          $Index = Join-Path $ReportDir "index.json"
          if (-not (Test-Path $Index)) { throw "Automation report missing - tests did not run" }
          $Json = Get-Content $Index -Raw
          if ($Json -match '"failed"\s*:\s*[1-9]' -or $Json -match '"state"\s*:\s*"fail') { throw "Automation report contains failed test(s)" }

      - name: Validate the generated league
        # Epic 122: PlaySports.Content.LeagueGenerator.WritesValidContent writes a generated
        # 32-team league to Saved/GeneratedLeague. It must pass every content contract, and the
        # content report must find nothing to warn about (no league of 99s, no repeated names).
        shell: powershell
        run: |
          if (-not (Test-Path "Saved/GeneratedLeague/Data/sample_league_config.json")) { throw "The league generator's test wrote no league" }
          python tools/content.py check --root Saved/GeneratedLeague --strict
          if ($LASTEXITCODE -ne 0) { throw "The generated league fails the content contracts or the content report" }

      - name: Summarize crash reports
        # Epic 117: a crash during the build or the tests leaves Saved/Crashes/<id>; print its
        # scrubbed call stack and game state here. Informational: it always exits 0.
        if: ${{ !cancelled() }}
        shell: powershell
        run: python tools/crash_report.py summarize

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-report
          path: Saved/AutomationReport/
          if-no-files-found: ignore
